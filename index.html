
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lily Bouquet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcomeScreen">
        <h1>A little flower for you ♡</h1>
        <p>Something beautiful is waiting...</p>
        <button id="enterButton">Enter My Garden 🌷</button>
    </div>

    <div class="page">
        <h1>You need flower ??<br>wait <i>i</i> can give it to you</h1>

        <div class="bouquet">
            <canvas id="flowerCanvas"></canvas>
        </div>

        <p>✦ a little bouquet made with love ✦</p>
    </div>

    <audio id="backgroundMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="musicButton">♫ Pause Music</button>

    <script src="script.js"></script>
</body>
</html>
